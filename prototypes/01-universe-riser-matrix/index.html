<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patch Risers | IWillDraft</title>
  <style>
    :root {
      --bg: #0b0f15;
      --surface: #111822;
      --surface-2: #16202e;
      --border: #1f2d40;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.14);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.15);
      --red: #f43f5e;
      --red-dim: rgba(244, 63, 94, 0.15);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --target-size: 24px;
    }
    @media (pointer: coarse) {
      :root { --target-size: 44px; }
    }
    html {
      container-type: scroll-state;
      scroll-padding-top: 3.5rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-block-size: 100svh;
      line-height: 1.45;
      overflow-wrap: break-word;
    }
    h1, h2, h3 { text-wrap: balance; }
    p, li { text-wrap: pretty; }
    :where(button, select, nav a, summary) {
      min-block-size: var(--target-size);
      min-inline-size: var(--target-size);
    }
    .topnav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 20px;
      background: rgba(8, 12, 18, 0.94);
      border-block-end: 1px solid var(--border);
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }
    @container scroll-state((scrolled: bottom) and (scrollable: top)) {
      .topnav { transform: translateY(-100%); }
    }
    .topnav:focus-within { transform: none; }
    .topnav.is-hidden:not(:focus-within) { transform: translateY(-100%); }
    .topnav a {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .topnav a:hover { color: var(--text); background: var(--surface); }
    .topnav a[aria-current="page"] { color: var(--accent); background: var(--accent-dim); font-weight: 600; }

    .shell { max-inline-size: 1200px; margin-inline: auto; padding: 20px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-block-end: 16px;
    }
    h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
    select, button {
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 12px;
      cursor: pointer;
    }
    select:hover, button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.45);
      font-weight: 600;
    }

    /* Accessible single-row tablist */
    .tablist {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 4px;
      border-block-end: 1px solid var(--border);
      margin-block-end: 18px;
      scrollbar-width: none;
    }
    .tablist::-webkit-scrollbar { display: none; }
    [role="tab"] {
      flex: none;
      position: relative;
      background: transparent;
      border: none;
      border-radius: 6px 6px 0 0;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
    }
    [role="tab"]:hover { color: var(--text); }
    [role="tab"][aria-selected="true"] {
      color: var(--accent);
    }
    [role="tab"][aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      border-block-end: 2px solid var(--accent);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
    }
    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-block-end: 14px;
    }
    .pill {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .pill[aria-pressed="true"] {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* Responsive table */
    .table-wrapper {
      overflow: auto;
      max-inline-size: 100%;
      container-type: inline-size;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.875rem;
    }
    caption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
    thead {
      position: sticky;
      inset-block-start: 0;
      z-index: 2;
      background: var(--surface);
    }
    th {
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 8px 10px;
      border-block-end: 1px solid var(--border);
      font-weight: 600;
    }
    tbody th {
      position: sticky;
      inset-inline-start: 0;
      z-index: 1;
      background: var(--surface);
      font-size: 0.9rem;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
      font-weight: 600;
    }
    td {
      padding: 10px;
      border-block-end: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
    }
    tbody tr { cursor: pointer; }
    tbody tr:hover th, tbody tr:hover td { background: var(--surface-2); }
    tbody tr.selected th, tbody tr.selected td { background: rgba(56, 189, 248, 0.1); }

    @container (width < 560px) {
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      tr {
        margin-block-end: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      tbody th {
        position: static;
        background: var(--surface-2);
        border-block-end: 1px solid var(--border);
      }
      td {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-block-end: 1px solid rgba(255, 255, 255, 0.04);
      }
      td::before {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .riser-table td:nth-child(2)::before { content: "Role"; }
      .riser-table td:nth-child(3)::before { content: "Shift"; }
      .riser-table td:nth-child(4)::before { content: "Key Buff"; }
      .riser-table td:nth-child(5)::before { content: "Scrim"; }
      .lck-table td:nth-child(2)::before { content: "LCK"; }
      .lck-table td:nth-child(3)::before { content: "LCS"; }
      .lck-table td:nth-child(4)::before { content: "Gap"; }
    }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .tag.up { color: var(--green); background: var(--green-dim); }
    .tag.warn { color: var(--amber); background: var(--amber-dim); }
    .tag.threat { color: var(--red); background: var(--red-dim); }
    .tag.edge { color: var(--accent); background: var(--accent-dim); }
    .mono { font-family: var(--mono); font-size: 0.8rem; }
    .muted { color: var(--muted); font-size: 0.82rem; }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .tile {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }
    .tile:hover, .tile.selected { border-color: var(--accent); }
    .tile-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-block-end: 8px;
    }
    .bar { height: 5px; background: #1c293a; border-radius: 4px; overflow: hidden; margin: 6px 0; }
    .bar > div { height: 100%; background: var(--accent); }

    .scrim-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-block-end: 10px;
    }

    .inspector h2 { font-size: 1.1rem; margin-block-end: 4px; }
    .kv {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-block-end: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.84rem;
    }
    .callout {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.84rem;
      margin-block: 12px;
    }
    details {
      margin-block: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      padding: 0 12px;
    }
    summary {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      padding: 8px 0;
      user-select: none;
    }
    details p {
      font-size: 0.8rem;
      color: var(--muted);
      padding-block-end: 10px;
    }
    @media (prefers-reduced-motion: reduce) {
      .topnav { transition: none; }
    }
  </style>
</head>

  <div class="shell">

  <script>
    const CHAMPIONS = [
      {
        id: 'azir', name: 'Azir', role: 'MID', zDelta: '+1.84σ',
        lever: 'W AP ratio up + higher 20:00 Baron DPS',
        breakpoint: 'Lv9 W+Q clears casters 1.4s faster; +14.2% Baron DPS at 20:00.',
        lckPres: '74%', lcsPres: '28%', gap: '+46%',
        c9: { player: 'Loki', games: 14, wr: '71%', gd15: '+480g' },
        opp: {
          fly: { player: 'Quad', games: 19, wr: '68%', gd15: '+390g', signal: 'THREAT' },
          tl: { player: 'APA', games: 4, wr: '25%', gd15: '-310g', signal: 'SLEEPER' }
        },
        scrimNote: 'Test B2/B3 Azir blind for Loki; check G1 ban priority vs Quad.'
      },
      {
        id: 'galio', name: 'Galio', role: 'MID', zDelta: '+1.62σ',
        lever: 'Passive CD refund + Hollow Radiance -100g',
        breakpoint: '1-wave Q+Passive clear on first base (850g).',
        lckPres: '68%', lcsPres: '31%', gap: '+37%',
        c9: { player: 'Loki', games: 8, wr: '63%', gd15: '+190g' },
        opp: {
          fly: { player: 'Quad', games: 12, wr: '75%', gd15: '+260g', signal: 'THREAT' },
          tl: { player: 'APA', games: 9, wr: '56%', gd15: '+110g', signal: 'THREAT' }
        },
        scrimNote: 'Test Vi + Galio denial on Red R1/R2.'
      },
      {
        id: 'gnar', name: 'Gnar', role: 'TOP', zDelta: '+1.49σ',
        lever: '+3 base AD + early Q CD -1.5s',
        breakpoint: 'Lv20 Top Quest adds +610 Mega HP and +19 Armor for Baron fights.',
        lckPres: '61%', lcsPres: '24%', gap: '+37%',
        c9: { player: 'Thanatos', games: 16, wr: '69%', gd15: '+520g' },
        opp: {
          fly: { player: 'Bwipo', games: 11, wr: '64%', gd15: '+210g', signal: 'SLEEPER' },
          tl: { player: 'Impact', games: 22, wr: '68%', gd15: '+290g', signal: 'THREAT' }
        },
        scrimNote: 'Prioritize Thanatos Gnar into blind tanks; strong G2/G3 stabilizer.'
      },
      {
        id: 'ksante', name: "K'Sante", role: 'TOP', zDelta: '+1.35σ',
        lever: 'E shield buff + higher W monster cap',
        breakpoint: '+9.5% faster Grub/Scuttle skirmish TTK after Chain Vest + Negatron.',
        lckPres: '81%', lcsPres: '49%', gap: '+32%',
        c9: { player: 'Thanatos', games: 21, wr: '71%', gd15: '+340g' },
        opp: {
          fly: { player: 'Bwipo', games: 7, wr: '43%', gd15: '-180g', signal: 'SLEEPER' },
          tl: { player: 'Impact', games: 18, wr: '67%', gd15: '+195g', signal: 'THREAT' }
        },
        scrimNote: 'Asymmetric edge vs FlyQuest: high Thanatos comfort while Bwipo avoids it P1.'
      },
      {
        id: 'sejuani', name: 'Sejuani', role: 'JGL', zDelta: '+1.28σ',
        lever: 'Camp HP -4% speeds first clear by 4.5s',
        breakpoint: '3:14 leashless Scuttle arrival with 1 Smite banked.',
        lckPres: '54%', lcsPres: '19%', gap: '+35%',
        c9: { player: 'Blaber', games: 13, wr: '69%', gd15: '+275g' },
        opp: {
          fly: { player: 'Inspired', games: 17, wr: '76%', gd15: '+410g', signal: 'THREAT' },
          tl: { player: 'Umti', games: 15, wr: '60%', gd15: '+140g', signal: 'THREAT' }
        },
        scrimNote: 'Track Sejuani + melee solo pairings in G3+ once Vi/Skarner are locked.'
      },
      {
        id: 'jinx', name: 'Jinx', role: 'BOT', zDelta: '+1.41σ',
        lever: 'Crit core -150g + 7th-item Bot ceiling',
        breakpoint: '2-item + T2 boots spike arrives ~55s earlier (17:40 avg).',
        lckPres: '58%', lcsPres: '33%', gap: '+25%',
        c9: { player: 'Zven', games: 15, wr: '73%', gd15: '+310g' },
        opp: {
          fly: { player: 'Massu', games: 11, wr: '64%', gd15: '+165g', signal: 'SLEEPER' },
          tl: { player: 'Yeon', games: 14, wr: '71%', gd15: '+380g', signal: 'THREAT' }
        },
        scrimNote: 'Test Jinx + Braum in G2/G3 after Kalista/Varus leave the pool.'
      },
      {
        id: 'rell', name: 'Rell', role: 'SUP', zDelta: '+1.19σ',
        lever: 'W mount MS +5 into river chokes',
        breakpoint: 'Flash+W→R syncs with 5:00 and 10:20 objective timers.',
        lckPres: '66%', lcsPres: '44%', gap: '+22%',
        c9: { player: 'Vulcan', games: 18, wr: '67%', gd15: '+220g' },
        opp: {
          fly: { player: 'Busio', games: 16, wr: '69%', gd15: '+240g', signal: 'THREAT' },
          tl: { player: 'CoreJJ', games: 20, wr: '70%', gd15: '+260g', signal: 'THREAT' }
        },
        scrimNote: 'High-value G1/G2 engage trade into immobile carries.'
      }
    ];

    const state = {
      step: 0,
      opp: 'fly',
      roleFilter: 'ALL',
      sigFilter: 'ALL',
      selectedId: 'azir',
      pinned: new Set(['azir', 'galio', 'ksante'])
    };

    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];

    function setStep(idx, focusTab = false) {
      state.step = Math.max(0, Math.min(tabs.length - 1, idx));
      tabs.forEach((tab, i) => {
        const active = i === state.step;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
        tab.toggleAttribute('focusgroupstart', active);
      });
      panels.forEach((panel, i) => {
        if (i === state.step) {
          panel.removeAttribute('hidden');
        } else {
          panel.hidden = 'until-found';
        }
      });
      const activeTab = tabs[state.step];
      activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (focusTab) activeTab.focus();
      renderAll();
    }

    panels.forEach((panel, i) => {
      panel.addEventListener('beforematch', () => setStep(i));
    });

    function togglePin(id, ev) {
      if (ev) ev.stopPropagation();
      if (state.pinned.has(id)) state.pinned.delete(id);
      else state.pinned.add(id);
      document.getElementById('pinCount').textContent = state.pinned.size;
      renderAll();
    }

    function renderUniverseTable() {
      const tbody = document.getElementById('universeTableBody');
      const rows = CHAMPIONS.filter(c => state.roleFilter === 'ALL' || c.role === state.roleFilter);
      tbody.innerHTML = rows.map(c => {
        const pinned = state.pinned.has(c.id);
        return `
          <tr class="${c.id === state.selectedId ? 'selected' : ''}" data-id="${c.id}">
            <th scope="row">${c.name}</th>
            <td class="mono muted">${c.role}</td>
            <td><span class="tag up">${c.zDelta}</span></td>
            <td>${c.lever}</td>
            <td><button type="button" class="${pinned ? 'primary' : ''}" data-pin="${c.id}">${pinned ? 'Pinned' : '+ Pin'}</button></td>
          </tr>
        `;
      }).join('');
    }

    function renderComfortMatrix() {
      const oppLabel = state.opp === 'fly' ? 'FLY' : 'TL';
      const grid = document.getElementById('comfortMatrixGrid');
      const items = CHAMPIONS.filter(c => state.sigFilter === 'ALL' || c.opp[state.opp].signal === state.sigFilter);
      grid.innerHTML = items.map(c => {
        const o = c.opp[state.opp];
        const isThreat = o.signal === 'THREAT';
        return `
          <div class="tile ${c.id === state.selectedId ? 'selected' : ''}" data-id="${c.id}">
            <div class="tile-head">
              <strong>${c.name} <span class="mono muted">${c.role}</span></strong>
              <span class="tag ${isThreat ? 'threat' : 'edge'}">${isThreat ? 'Threat' : 'C9 Edge'}</span>
            </div>
            <div style="font-size:0.8rem"><strong>C9 ${c.c9.player}</strong> · ${c.c9.wr} · <span class="mono">${c.c9.gd15}</span></div>
            <div class="bar"><div style="width:${Math.min(100, c.c9.games * 4.5)}%"></div></div>
            <div class="muted" style="font-size:0.8rem"><strong>${oppLabel} ${o.player}</strong> · ${o.wr} · <span class="mono">${o.gd15}</span></div>
          </div>
        `;
      }).join('');
    }

    function renderLckLag() {
      document.getElementById('lckLagBody').innerHTML = CHAMPIONS.map(c => `
        <tr class="${c.id === state.selectedId ? 'selected' : ''}" data-id="${c.id}">
          <th scope="row">${c.name} <span class="mono muted">${c.role}</span></th>
          <td class="mono">${c.lckPres}</td>
          <td class="mono">${c.lcsPres}</td>
          <td><span class="tag warn">${c.gap}</span></td>
        </tr>
      `).join('');
    }

    function renderScrimBrief() {
      const wrap = document.getElementById('scrimBriefList');
      const list = CHAMPIONS.filter(c => state.pinned.has(c.id));
      if (!list.length) {
        wrap.innerHTML = `<p class="muted">No champions pinned.</p>`;
        return;
      }
      wrap.innerHTML = list.map(c => `
        <div class="scrim-item">
          <div>
            <strong>${c.name}</strong> <span class="tag up" style="margin-inline-start:6px">${c.zDelta}</span>
            <p class="muted" style="margin-block-start:4px">${c.scrimNote}</p>
          </div>
          <button type="button" data-pin="${c.id}">Remove</button>
        </div>
      `).join('');
    }

    function renderInspector() {
      const c = CHAMPIONS.find(x => x.id === state.selectedId) || CHAMPIONS[0];
      const o = c.opp[state.opp];
      const oppTeam = state.opp === 'fly' ? 'FLY' : 'TL';
      const pinned = state.pinned.has(c.id);
      const isThreat = o.signal === 'THREAT';
      document.getElementById('inspectorCard').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-block-end:6px">
          <h2>${c.name}</h2>
          <span class="tag ${isThreat ? 'threat' : 'edge'}">${isThreat ? 'Threat' : 'C9 Edge'}</span>
        </div>
        <div class="kv"><span>Power Shift</span><span class="tag up">${c.zDelta}</span></div>
        <div class="kv"><span>C9 ${c.c9.player}</span><span class="mono">${c.c9.games}g · ${c.c9.wr} · ${c.c9.gd15}</span></div>
        <div class="kv"><span>${oppTeam} ${o.player}</span><span class="mono">${o.games}g · ${o.wr} · ${o.gd15}</span></div>
        <div class="kv"><span>LCK / LCS</span><span class="mono">${c.lckPres} / ${c.lcsPres}</span></div>
        <div class="callout">${c.scrimNote}</div>
        <details>
          <summary>Breakpoint details</summary>
          <p>${c.breakpoint}</p>
        </details>
        <button type="button" class="primary" style="width:100%" data-pin="${c.id}">
          ${pinned ? 'Pinned to Scrim List' : '+ Pin to Scrim List'}
        </button>
      `;
    }

    function renderAll() {
      renderUniverseTable();
      renderComfortMatrix();
      renderLckLag();
      renderScrimBrief();
      renderInspector();
    }

    document.getElementById('tablist').addEventListener('click', e => {
      const btn = e.target.closest('[role="tab"]');
      if (btn) setStep(Number(btn.dataset.step));
    });
    document.getElementById('tablist').addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); setStep((state.step + 1) % tabs.length, true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); setStep((state.step - 1 + tabs.length) % tabs.length, true); }
      else if (e.key === 'Home') { e.preventDefault(); setStep(0, true); }
      else if (e.key === 'End') { e.preventDefault(); setStep(tabs.length - 1, true); }
    });
    document.getElementById('oppSelect').addEventListener('change', e => {
      state.opp = e.target.value;
      renderAll();
    });
    document.getElementById('rolePills').addEventListener('click', e => {
      const p = e.target.closest('.pill');
      if (!p) return;
      state.roleFilter = p.dataset.role;
      document.querySelectorAll('#rolePills .pill').forEach(el => el.setAttribute('aria-pressed', String(el === p)));
      renderAll();
    });
    document.getElementById('signalPills').addEventListener('click', e => {
      const p = e.target.closest('.pill');
      if (!p) return;
      state.sigFilter = p.dataset.sig;
      document.querySelectorAll('#signalPills .pill').forEach(el => el.setAttribute('aria-pressed', String(el === p)));
      renderAll();
    });
    document.body.addEventListener('click', e => {
      const pinBtn = e.target.closest('[data-pin]');
      if (pinBtn) { togglePin(pinBtn.dataset.pin, e); return; }
      const row = e.target.closest('[data-id]');
      if (row) { state.selectedId = row.dataset.id; renderAll(); }
    });

    if (!CSS.supports('container-type', 'scroll-state')) {
      const bar = document.querySelector('.topnav');
      let lastY = scrollY;
      addEventListener('scroll', () => {
        const y = Math.max(0, Math.min(scrollY, document.documentElement.scrollHeight - innerHeight));
        if (y === lastY) return;
        bar?.classList.toggle('is-hidden', y > lastY && y > bar.offsetHeight);
        lastY = y;
      }, { passive: true });
    }

    renderAll();
  </script>
</body>
</html>
