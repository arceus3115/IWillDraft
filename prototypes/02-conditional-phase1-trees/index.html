<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase-1 Draft Trees | IWillDraft</title>
  <style>
    :root {
      --bg: #0b0f15;
      --surface: #111822;
      --surface-2: #16202e;
      --border: #1f2d40;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.14);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.15);
      --red: #f43f5e;
      --red-dim: rgba(244, 63, 94, 0.15);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --target-size: 24px;
    }
    @media (pointer: coarse) {
      :root { --target-size: 44px; }
    }
    html {
      container-type: scroll-state;
      scroll-padding-top: 3.5rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-block-size: 100svh;
      line-height: 1.45;
      overflow-wrap: break-word;
    }
    h1, h2, h3 { text-wrap: balance; }
    p, li { text-wrap: pretty; }
    :where(button, select, nav a, summary) {
      min-block-size: var(--target-size);
      min-inline-size: var(--target-size);
    }
    .topnav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 20px;
      background: rgba(8, 12, 18, 0.94);
      border-block-end: 1px solid var(--border);
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }
    @container scroll-state((scrolled: bottom) and (scrollable: top)) {
      .topnav { transform: translateY(-100%); }
    }
    .topnav:focus-within { transform: none; }
    .topnav.is-hidden:not(:focus-within) { transform: translateY(-100%); }
    .topnav a {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .topnav a:hover { color: var(--text); background: var(--surface); }
    .topnav a[aria-current="page"] { color: var(--accent); background: var(--accent-dim); font-weight: 600; }

    .shell { max-inline-size: 1200px; margin-inline: auto; padding: 20px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-block-end: 16px;
    }
    h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
    select, button {
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 12px;
      cursor: pointer;
    }
    select:hover, button:hover { border-color: var(--accent); }

    .tablist {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 4px;
      border-block-end: 1px solid var(--border);
      margin-block-end: 18px;
      scrollbar-width: none;
    }
    .tablist::-webkit-scrollbar { display: none; }
    [role="tab"] {
      flex: none;
      position: relative;
      background: transparent;
      border: none;
      border-radius: 6px 6px 0 0;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
    }
    [role="tab"]:hover { color: var(--text); }
    [role="tab"][aria-selected="true"] { color: var(--accent); }
    [role="tab"][aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      border-block-end: 2px solid var(--accent);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
    }
    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .tree-wrap { container-type: inline-size; }
    .tree-cols {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @container (inline-size >= 620px) {
      .tree-cols { grid-template-columns: repeat(3, 1fr); }
    }
    .col-head {
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-block-end: 8px;
      padding-block-end: 6px;
      border-block-end: 1px solid var(--border);
    }
    .node {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      margin-block-end: 8px;
      color: var(--text);
    }
    .node:hover { background: var(--surface-2); border-color: var(--border); }
    .node.active-blue { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
    .node.active-red { border-color: var(--red); background: rgba(244, 63, 94, 0.1); }
    .node-static { cursor: default; }
    .node-static:hover { background: var(--bg); }
    .node-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-block-end: 5px;
    }
    .pct { font-family: var(--mono); font-size: 0.8rem; font-weight: 700; color: var(--accent); }
    .pct.red { color: #fb7185; }
    .bar { height: 4px; background: #1c293a; border-radius: 4px; overflow: hidden; margin: 6px 0; }
    .bar > div { height: 100%; background: var(--accent); }
    .bar.red > div { background: var(--red); }

    .flex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }
    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .tag.bluff { color: var(--amber); background: var(--amber-dim); }
    .tag.trueflex { color: var(--green); background: var(--green-dim); }
    .mono { font-family: var(--mono); font-size: 0.8rem; }
    .muted { color: var(--muted); font-size: 0.8rem; }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-block-end: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.84rem;
    }
    .callout {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.84rem;
      margin-block: 12px;
    }
    details {
      margin-block-start: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      padding: 0 12px;
    }
    summary {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      padding: 8px 0;
      user-select: none;
    }
    .match-item {
      padding-block: 8px;
      border-block-start: 1px solid rgba(255, 255, 255, 0.06);
    }
    .ribbon { display: flex; gap: 4px; flex-wrap: wrap; margin-block-start: 6px; }
    .slot {
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .slot.b { border-color: rgba(56, 189, 248, 0.4); color: #7dd3fc; }
    .slot.r { border-color: rgba(244, 63, 94, 0.4); color: #fda4af; }
    @media (prefers-reduced-motion: reduce) {
      .topnav { transition: none; }
    }
  </style>
</head>

  <div class="shell">
    <header class="header">
      <h1>Phase-1 Draft Trees</h1>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="gameMode" aria-label="Fearless game">
          <option value="1">Fearless G1 (0 locked)</option>
          <option value="2">Fearless G2 (10 locked)</option>
          <option value="3">Fearless G3 (20 locked)</option>
          <option value="4">Fearless G4 (30 locked)</option>
          <option value="5">Fearless G5 (40 locked)</option>
        </select>
        <select id="sideMode" aria-label="Draft side">
          <option value="c9blue">C9 Blue · FLY Red</option>
          <option value="flyblue">FLY Blue · C9 Red</option>
        </select>
      </div>
    </header>

    <div class="tablist" role="tablist" focusgroup="tablist nomemory" aria-label="Draft tree views" id="tablist">
      <button type="button" role="tab" id="tab-0" aria-selected="true" focusgroupstart tabindex="0" data-step="0">Opening Tree</button>
      <button type="button" role="tab" id="tab-1" aria-selected="false" tabindex="-1" data-step="1">Flex Audit</button>
    </div>

    <div class="workspace">
      <main>
        <section role="tabpanel" id="panel-0" aria-labelledby="tab-0">
          <div class="panel-box tree-wrap">
            <div class="tree-cols">
              <div>
                <div class="col-head">B1 Opener</div>
                <div id="colB1"></div>
              </div>
              <div>
                <div class="col-head">R1 / R2 Response</div>
                <div id="colR12"></div>
              </div>
              <div>
                <div class="col-head">Next Pivot</div>
                <div id="colR3"></div>
              </div>
            </div>
          </div>
        </section>

        <section role="tabpanel" id="panel-1" aria-labelledby="tab-1" hidden="until-found">
          <div class="panel-box">
            <div class="flex-grid" id="flexGrid"></div>
          </div>
        </section>
      </main>

      <aside class="panel-box" id="branchInspector" aria-live="polite"></aside>
    </div>
  </div>

  <script src="../shared/engine.js"></script>
  <script>
    const E = window.IWillDraftEngine;
    const TREE = {
      c9blue: [
        {
          id: 'aurora', b1: 'Aurora', champ: 'Aurora', games: 11, share: '38%',
          r12: [
            {
              id: 'vi-galio', pair: 'Vi + Galio', champs: ['Vi', 'Galio'], baseRate: 64, count: '7/11', wr: '71% FLY', gd15: '+640g', epaDelta: '-4.2% C9',
              empMetric: 'Conditional R1/R2 rate 64% (n=11) · FLY +640g @15 · C9 ΔWP -4.2%',
              pivots: [
                { label: 'FLY R3: Ashe / Kalista (71%)', detail: 'n=7 · Bot GD@15 +320g · First Dragon 71%' },
                { label: 'C9 B2: Poppy (n=4)', detail: 'C9 WR 75% (3/4) · Mid-setup EPA +3.1%' }
              ],
              matches: [
                { meta: '26.14 · FLY Win (31:12)', seq: ['B1 Aurora', 'R1 Vi', 'R2 Galio', 'B2 Ezreal', 'B3 Leona', 'R3 Rumble'] },
                { meta: '26.13 · FLY Win (29:44)', seq: ['B1 Aurora', 'R1 Vi', 'R2 Galio', 'B2 KaiSa', 'B3 Rell', 'R3 Gnar'] }
              ]
            },
            {
              id: 'skarner-ori', pair: 'Skarner + Orianna', champs: ['Skarner', 'Orianna'], baseRate: 27, count: '3/11', wr: '33% FLY', gd15: '-420g', epaDelta: '+3.1% C9',
              empMetric: 'Conditional R1/R2 rate 27% (n=11) · FLY -420g @15 · C9 ΔWP +3.1%',
              pivots: [
                { label: 'FLY R3: Renekton (67%)', detail: 'n=3 · 6:00 Grub share 33% · C9 WR 67%' }
              ],
              matches: [
                { meta: '26.18 · C9 Win (33:05)', seq: ['B1 Aurora', 'R1 Skarner', 'R2 Orianna', 'B2 Nocturne', 'B3 Rell', 'R3 Renekton'] }
              ]
            },
            {
              id: 'poppy-hwei', pair: 'Poppy + Hwei', champs: ['Poppy', 'Hwei'], baseRate: 9, count: '1/11', wr: '0% FLY', gd15: '-310g', epaDelta: '+2.4% C9',
              empMetric: 'Fallback R1/R2 when Vi/Galio/Orianna locked · C9 ΔWP +2.4%',
              pivots: [
                { label: 'FLY R3: Jhin / Ezreal', detail: 'n=1 · P2–P3 EPA -1.8% FLY' }
              ],
              matches: [
                { meta: '26.21 · C9 Win (30:18)', seq: ['B1 Aurora', 'R1 Poppy', 'R2 Hwei', 'B2 Wukong', 'B3 Xayah', 'R3 Jhin'] }
              ]
            }
          ]
        },
        {
          id: 'yone', b1: 'Yone', champ: 'Yone', games: 9, share: '31%',
          r12: [
            {
              id: 'sej-renek', pair: 'Sejuani + Renekton', champs: ['Sejuani', 'Renekton'], baseRate: 56, count: '5/9', wr: '60% FLY', gd15: '+310g', epaDelta: '-1.8% C9',
              empMetric: 'Conditional R1/R2 rate 56% (n=9) · FLY +310g @15 · C9 ΔWP -1.8%',
              pivots: [
                { label: 'FLY R3: Taliyah / Cassiopeia (80%)', detail: 'n=5 · Mid/Jgl 2v2 EPA +2.4% FLY' }
              ],
              matches: [
                { meta: '26.06 · FLY Win (34:50)', seq: ['B1 Yone', 'R1 Sejuani', 'R2 Renekton', 'B2 Zyra', 'B3 Ashe', 'R3 Taliyah'] }
              ]
            },
            {
              id: 'maokai-tris', pair: 'Maokai + Tristana', champs: ['Maokai', 'Tristana'], baseRate: 33, count: '3/9', wr: '67% FLY', gd15: '+280g', epaDelta: '-2.1% C9',
              empMetric: 'Maokai 100% JGL (3/3) · FLY +280g @15 · C9 ΔWP -2.1%',
              pivots: [
                { label: 'FLY R3: Braum / Alistar (100%)', detail: 'n=3 · 22m+ Fight SR 67% FLY' }
              ],
              matches: [
                { meta: '26.07 · FLY Win (28:19)', seq: ['B1 Yone', 'R1 Maokai', 'R2 Tristana', 'B2 Vi', 'B3 Rakan', 'R3 Alistar'] }
              ]
            }
          ]
        },
        {
          id: 'skarner', b1: 'Skarner', champ: 'Skarner', games: 8, share: '28%',
          r12: [
            {
              id: 'varus-rell', pair: 'Varus + Rell', champs: ['Varus', 'Rell'], baseRate: 63, count: '5/8', wr: '40% FLY', gd15: '-190g', epaDelta: '+1.9% C9',
              empMetric: 'Conditional R1/R2 rate 63% (n=8) · FLY -190g @15 · C9 ΔWP +1.9%',
              pivots: [
                { label: 'FLY R3: Olaf / Mordekaiser (60%)', detail: 'n=5 · Top GD@15 +110g · FLY WR 40%' }
              ],
              matches: [
                { meta: '26.19 · C9 Win (30:41)', seq: ['B1 Skarner', 'R1 Varus', 'R2 Rell', 'B2 Azir', 'B3 Xayah', 'R3 Olaf'] }
              ]
            }
          ]
        }
      ],
      flyblue: [
        {
          id: 'fly-vi', b1: 'FLY B1: Vi', champ: 'Vi', games: 10, share: '42%',
          r12: [
            {
              id: 'c9-poppy-jinx', pair: 'Poppy + Jinx', champs: ['Poppy', 'Jinx'], baseRate: 40, count: '4/10', wr: '25% FLY', gd15: '-510g', epaDelta: '+4.4% C9',
              empMetric: 'C9 WR 75% (3/4) · FLY -510g @15 · C9 ΔWP +4.4%',
              pivots: [
                { label: 'FLY B2/B3: Galio + Ashe (70%)', detail: 'n=10 · When Poppy open: FLY WR 25%' }
              ],
              matches: [
                { meta: '26.19 · C9 Win (32:08)', seq: ['B1 Vi', 'R1 Poppy', 'R2 Jinx', 'B2 Ahri', 'B3 Ezreal', 'R3 Braum'] }
              ]
            }
          ]
        },
        {
          id: 'fly-aurora', b1: 'FLY B1: Aurora', champ: 'Aurora', games: 9, share: '38%',
          r12: [
            {
              id: 'c9-galio-j4', pair: 'Galio + Jarvan IV', champs: ['Galio', 'Jarvan IV'], baseRate: 55, count: '5/9', wr: '33% FLY', gd15: '-290g', epaDelta: '+2.9% C9',
              empMetric: 'Aurora 89% Quad Mid (8/9) · C9 WR 67% · ΔWP +2.9%',
              pivots: [
                { label: 'Role Split: 89% Mid / 11% Top', detail: 'n=9 · Entropy H = 0.50 bits (low flex)' }
              ],
              matches: [
                { meta: '26.15 · C9 Win (35:22)', seq: ['B1 Aurora', 'R1 Galio', 'R2 Jarvan IV', 'B2 Kalista', 'B3 Renata', 'R3 Gnar'] }
              ]
            }
          ]
        }
      ]
    };

    const FLEX_PICKS = [
      { champ: 'Aurora', verdict: 'BLUFF', split: '89% Mid · 11% Top', note: 'n=9 · Shannon Entropy H=0.50 bits · Quad GD@15 +210g.' },
      { champ: 'Poppy', verdict: 'TRUE FLEX', split: '50% Sup · 33% Jgl · 17% Top', note: 'n=12 · Shannon Entropy H=1.46 bits · True 3-role variance.' },
      { champ: 'Maokai', verdict: 'BLUFF', split: '100% Jgl · 0% Sup', note: 'n=8 · Shannon Entropy H=0.00 bits · 0% non-Jungle observations.' },
      { champ: 'Rumble', verdict: 'BLUFF', split: '86% Top · 14% Mid', note: 'n=7 · Shannon Entropy H=0.59 bits · Bwipo Top share 86%.' }
    ];

    const state = { step: 0, mode: 'c9blue', game: 1, b1Idx: 0, r12Idx: 0 };
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];

    function setStep(idx, focusTab = false) {
      state.step = Math.max(0, Math.min(tabs.length - 1, idx));
      tabs.forEach((tab, i) => {
        const active = i === state.step;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
        tab.toggleAttribute('focusgroupstart', active);
      });
      panels.forEach((panel, i) => {
        if (i === state.step) panel.removeAttribute('hidden');
        else panel.hidden = 'until-found';
      });
      tabs[state.step].scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (focusTab) tabs[state.step].focus();
      renderAll();
    }

    panels.forEach((panel, i) => panel.addEventListener('beforematch', () => setStep(i)));

    function renderAll() {
      const lockedSet = E.getLockedChampions(state.game);
      const branches = TREE[state.mode];
      const b1 = branches[state.b1Idx] || branches[0];
      const renormR12 = E.renormalizeBranches(b1.r12, lockedSet, item => item.champs || []);
      const r12 = renormR12[state.r12Idx] || renormR12[0];

      document.getElementById('colB1').innerHTML = branches.map((item, idx) => {
        const locked = lockedSet.has(item.champ);
        return `
        <button type="button" class="node ${idx === state.b1Idx ? 'active-blue' : ''}" data-b1="${idx}" style="${locked ? 'opacity:0.48' : ''}">
          <div class="node-top"><strong>${item.b1}</strong><span class="pct">${locked ? 'Locked' : item.share}</span></div>
          <div class="bar"><div style="width:${locked ? 0 : parseInt(item.share, 10)}%"></div></div>
          <div class="muted">n=${item.games} · ${locked ? 'Fearless G' + state.game + ' locked' : 'Legal'}</div>
        </button>
      `;
      }).join('');

      document.getElementById('colR12').innerHTML = renormR12.map((item, idx) => `
        <button type="button" class="node ${idx === state.r12Idx ? 'active-red' : ''}" data-r12="${idx}" style="${item.fearlessLocked ? 'opacity:0.48' : ''}">
          <div class="node-top"><strong>${item.pair}</strong><span class="pct red">${item.fearlessLocked ? 'Locked' : item.adjRate + '%'}</span></div>
          <div class="bar red"><div style="width:${item.adjRate}%"></div></div>
          <div class="muted">${item.wr} · <span class="mono">${item.gd15}</span>${!item.fearlessLocked && item.adjRate !== item.baseRate ? ' · <span class="mono">base ' + item.baseRate + '%</span>' : ''}</div>
        </button>
      `).join('');

      document.getElementById('colR3').innerHTML = r12.pivots.map(p => `
        <div class="node node-static">
          <strong style="font-size:0.86rem;display:block;margin-block-end:4px">${p.label}</strong>
          <p class="muted mono" style="font-size:0.78rem">${p.detail}</p>
        </div>
      `).join('');

      document.getElementById('flexGrid').innerHTML = FLEX_PICKS.map(f => {
        const locked = lockedSet.has(f.champ);
        return `
        <div class="node node-static" style="${locked ? 'opacity:0.5' : ''}">
          <div class="node-top">
            <strong>${f.champ}</strong>
            <span class="tag ${locked ? 'bluff' : f.verdict === 'BLUFF' ? 'bluff' : 'trueflex'}">${locked ? 'Locked G' + state.game : f.verdict}</span>
          </div>
          <div class="mono" style="color:var(--accent);margin-block:6px">${f.split}</div>
          <p class="muted mono" style="font-size:0.78rem">${f.note}</p>
        </div>
      `;
      }).join('');

      document.getElementById('branchInspector').innerHTML = `
        <h2 style="font-size:1.05rem;margin-block-end:8px">${b1.b1} → ${r12.pair}</h2>
        <div class="kv"><span>Fearless G${state.game} Prob</span><span class="mono">${r12.fearlessLocked ? '0% (Locked)' : r12.adjRate + '%'} (base ${r12.baseRate}%, ${r12.count})</span></div>
        <div class="kv"><span>Win Rate</span><span class="mono">${r12.wr}</span></div>
        <div class="kv"><span>GD@15 / ΔWP</span><span class="mono">${r12.gd15} · ${r12.epaDelta}</span></div>
        <div class="callout mono" style="font-size:0.78rem">${r12.empMetric}</div>
        <details>
          <summary>Observed drafts (n=${r12.matches.length})</summary>
          ${r12.matches.map(m => `
            <div class="match-item">
              <div class="muted">${m.meta}</div>
              <div class="ribbon">
                ${m.seq.map(s => `<span class="slot ${s.startsWith('B') ? 'b' : 'r'}">${s}</span>`).join('')}
              </div>
            </div>
          `).join('')}
        </details>
      `;
    }

    document.getElementById('tablist').addEventListener('click', e => {
      const b = e.target.closest('[role="tab"]');
      if (b) setStep(Number(b.dataset.step));
    });
    document.getElementById('tablist').addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); setStep((state.step + 1) % tabs.length, true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); setStep((state.step - 1 + tabs.length) % tabs.length, true); }
      else if (e.key === 'Home') { e.preventDefault(); setStep(0, true); }
      else if (e.key === 'End') { e.preventDefault(); setStep(tabs.length - 1, true); }
    });
    document.getElementById('sideMode').addEventListener('change', e => {
      state.mode = e.target.value;
      state.b1Idx = 0;
      state.r12Idx = 0;
      renderAll();
    });
    document.getElementById('gameMode').addEventListener('change', e => {
      state.game = Number(e.target.value);
      renderAll();
    });
    document.body.addEventListener('click', e => {
      const b1 = e.target.closest('[data-b1]');
      if (b1) { state.b1Idx = Number(b1.dataset.b1); state.r12Idx = 0; renderAll(); return; }
      const r12 = e.target.closest('[data-r12]');
      if (r12) { state.r12Idx = Number(r12.dataset.r12); renderAll(); }
    });

    if (!CSS.supports('container-type', 'scroll-state')) {
      const bar = document.querySelector('.topnav');
      let lastY = scrollY;
      addEventListener('scroll', () => {
        const y = Math.max(0, Math.min(scrollY, document.documentElement.scrollHeight - innerHeight));
        if (y === lastY) return;
        bar?.classList.toggle('is-hidden', y > lastY && y > bar.offsetHeight);
        lastY = y;
      }, { passive: true });
    }

    renderAll();
  </script>
</body>
</html>
