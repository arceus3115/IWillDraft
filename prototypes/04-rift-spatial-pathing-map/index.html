<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Early Pathing & Faelights | IWillDraft</title>
  <style>
    :root {
      --bg: #0b0f15;
      --surface: #111822;
      --surface-2: #16202e;
      --border: #1f2d40;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.14);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --red: #f43f5e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --target-size: 24px;
    }
    @media (pointer: coarse) {
      :root { --target-size: 44px; }
    }
    html {
      container-type: scroll-state;
      scroll-padding-top: 3.5rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-block-size: 100svh;
      line-height: 1.45;
      overflow-wrap: break-word;
    }
    h1, h2, h3 { text-wrap: balance; }
    p, li { text-wrap: pretty; }
    :where(button, nav a) {
      min-block-size: var(--target-size);
      min-inline-size: var(--target-size);
    }
    .topnav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 20px;
      background: rgba(8, 12, 18, 0.94);
      border-block-end: 1px solid var(--border);
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }
    @container scroll-state((scrolled: bottom) and (scrollable: top)) {
      .topnav { transform: translateY(-100%); }
    }
    .topnav:focus-within { transform: none; }
    .topnav.is-hidden:not(:focus-within) { transform: translateY(-100%); }
    .topnav a {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .topnav a:hover { color: var(--text); background: var(--surface); }
    .topnav a[aria-current="page"] { color: var(--accent); background: var(--accent-dim); font-weight: 600; }

    .shell { max-inline-size: 1200px; margin-inline: auto; padding: 20px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-block-end: 16px;
    }
    h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
    button {
      font-family: inherit;
      font-size: 0.84rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 11px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }

    .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      font-size: 0.8rem;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .pill[aria-pressed="true"] {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
      font-weight: 600;
    }

    .tablist {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 4px;
      border-block-end: 1px solid var(--border);
      margin-block-end: 18px;
      scrollbar-width: none;
    }
    .tablist::-webkit-scrollbar { display: none; }
    [role="tab"] {
      flex: none;
      position: relative;
      background: transparent;
      border: none;
      border-radius: 6px 6px 0 0;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
    }
    [role="tab"]:hover { color: var(--text); }
    [role="tab"][aria-selected="true"] { color: var(--accent); }
    [role="tab"][aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      border-block-end: 2px solid var(--accent);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
    }
    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .map-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #091018;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    svg.rift { width: 100%; max-inline-size: 500px; block-size: auto; border-radius: 6px; background: #0c1714; }
    .hotspot { cursor: pointer; }
    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-block-start: 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      inline-size: 9px;
      block-size: 9px;
      border-radius: 50%;
      margin-inline-end: 5px;
      vertical-align: middle;
    }
    .marker-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-block: 12px 8px;
    }
    .marker-btn {
      font-size: 0.78rem;
      padding: 4px 9px;
      background: var(--bg);
    }
    .marker-btn[aria-pressed="true"] {
      border-color: var(--red);
      color: #fda4af;
      background: rgba(244, 63, 94, 0.14);
    }
    .box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 0.85rem;
      margin-block-end: 12px;
    }
    .box.counter {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.08);
      color: #d1fae5;
      margin-block-end: 0;
    }
    .box-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-block-end: 4px;
    }
    .box.counter .box-label { color: var(--green); }
    @media (prefers-reduced-motion: reduce) {
      .topnav { transition: none; }
    }
  </style>
</head>
<body>
  <nav class="topnav" aria-label="Tools">
    <a href="../index.html">← All</a>
    <a href="../01-universe-riser-matrix/index.html">01 Risers</a>
    <a href="../02-conditional-phase1-trees/index.html">02 Draft Trees</a>
    <a href="../03-fearless-pool-cliff-planner/index.html">03 Fearless Cliffs</a>
    <a aria-current="page" href="../04-rift-spatial-pathing-map/index.html">04 Early Pathing</a>
    <a href="../05-playbook-huddle-stage-binder/index.html">05 Match Day</a>
  </nav>

  <div class="shell">
    <header class="header">
      <h1>Early Pathing &amp; Faelights</h1>
      <div class="pill-row" id="prioStrip" role="group" aria-label="Lane priority state">
        <button type="button" class="pill" aria-pressed="true" data-prio="botpush">Bot Prio</button>
        <button type="button" class="pill" aria-pressed="false" data-prio="toppush">Top Prio</button>
        <button type="button" class="pill" aria-pressed="false" data-prio="engage">Engage Roam</button>
      </div>
    </header>

    <div class="tablist" role="tablist" focusgroup="tablist nomemory" aria-label="Game time phase" id="tablist">
      <button type="button" role="tab" id="tab-0" aria-selected="true" focusgroupstart tabindex="0" data-step="0">0:00–1:30 Invades</button>
      <button type="button" role="tab" id="tab-1" aria-selected="false" tabindex="-1" data-step="1">1:30–5:30 Clears</button>
      <button type="button" role="tab" id="tab-2" aria-selected="false" tabindex="-1" data-step="2">5:30–8:00 Objectives</button>
    </div>

    <div class="workspace">
      <main class="panel-box" role="tabpanel" id="mapPanel" aria-labelledby="tab-0">
        <div class="map-wrap">
          <svg class="rift" viewBox="0 0 500 500" id="riftSvg" aria-label="Summoner's Rift early pathing map"></svg>
        </div>
        <div class="legend">
          <span><i class="dot" style="background:#f43f5e"></i>Primary route</span>
          <span><i class="dot" style="background:#f59e0b"></i>Secondary</span>
          <span><i class="dot" style="background:#38bdf8"></i>Faelight ring</span>
        </div>
      </main>

      <aside class="panel-box" id="mapInspector" aria-live="polite"></aside>
    </div>
  </div>

  <script>
    const SCENARIOS = {
      0: {
        botpush: {
          headline: '73% Late Bot-River → Raptor Ward (1:08–1:16)',
          pathMain: 'M 420,80 L 350,160 L 315,245 L 275,275',
          pathAlt: 'M 420,80 L 410,290 L 365,365',
          faelights: [{ x: 318, y: 295, label: 'Bot River (82%)' }],
          markers: [
            { x: 275, y: 275, label: '1:12 Raptor Ward', detail: 'Busio + Inspired walk mid-to-raptor choke together when holding Kalista/Ashe prio.' },
            { x: 365, y: 365, label: '0:52 Tribush Stack', detail: '27% variant: 3-man bot tribush stack into enchanter supports.' }
          ],
          counter: 'Hold Mid at Raptor entrance until 1:15 or counter-ward Red Blue quadrant at 0:55.'
        },
        toppush: {
          headline: '78% Top Pixel Stack & Blue Protection',
          pathMain: 'M 420,80 L 240,95 L 175,165',
          pathAlt: 'M 420,80 L 295,185',
          faelights: [{ x: 185, y: 190, label: 'Top River (78%)' }],
          markers: [
            { x: 175, y: 165, label: '1:05 Top Pixel Ward', detail: 'Bwipo + Inspired anchor top river entrance to spot camp-start swaps.' }
          ],
          counter: 'Safe for Blaber to start Bot leashless; 0% bot tribush invades in this state.'
        },
        engage: {
          headline: '85% 4-Man Mid-to-Bot Banana Sweep (0:58)',
          pathMain: 'M 420,80 L 330,220 L 335,320',
          pathAlt: 'M 420,80 L 260,250',
          faelights: [{ x: 318, y: 295, label: 'Bot River' }],
          markers: [
            { x: 335, y: 320, label: '1:02 Banana Trap', detail: 'With Rell/Nautilus, FlyQuest sweeps mid brush to force early Flash.' }
          ],
          counter: 'Concede bot river pixel before 1:10; walk Bot through lane Tier-1.'
        }
      },
      1: {
        botpush: {
          headline: '82% Top-to-Bot Clear → 3:22 Bot Dive',
          pathMain: 'M 275,125 L 220,145 L 335,235 L 385,295 L 345,355',
          pathAlt: 'M 275,125 L 335,235 L 250,250',
          faelights: [{ x: 335, y: 335, label: '3:18 Scuttle' }],
          markers: [
            { x: 275, y: 125, label: '1:30 Top Start', detail: 'Starts Top quadrant to arrive on pushing Bot wave 3/4.' },
            { x: 345, y: 355, label: '3:28 Bot Dive', detail: 'Skips Krugs 45% of the time if enemy Bot drops under 60% HP.' }
          ],
          counter: 'Cross-map Top Gromp or have Blaber hover Bot Tier-1 at 3:20.'
        },
        toppush: {
          headline: '77% Bot-to-Top Clear → 3:30 Top Cover',
          pathMain: 'M 380,280 L 335,235 L 265,135 L 155,145',
          pathAlt: 'M 380,280 L 250,250',
          faelights: [{ x: 185, y: 190, label: 'Top Scuttle' }],
          markers: [
            { x: 155, y: 145, label: '3:32 Top Cover', detail: 'Covers Bwipo wave-4 crash before resetting for 6:00 Grubs.' }
          ],
          counter: 'Ward Top tribush at 2:55 and trim wave 3 to deny dive setup.'
        },
        engage: {
          headline: '69% 3-Camp → 3:55 Mid Pinch w/ Support',
          pathMain: 'M 380,280 L 335,235 L 255,245',
          pathAlt: 'M 390,390 L 310,305 L 255,245',
          faelights: [{ x: 295, y: 275, label: 'Mid-Bot' }],
          markers: [
            { x: 255, y: 245, label: '3:55 Mid 3v1', detail: 'Busio recalls at 3:25 and walks straight from base to Mid side-brush.' }
          ],
          counter: 'Track Support reset at 3:30; Loki leans Top-side river.'
        }
      },
      2: {
        botpush: {
          headline: '88% First-Drake Lock w/ Dual Bot Faelights',
          pathMain: 'M 395,380 L 335,335 L 315,310',
          pathAlt: 'M 250,250 L 295,285',
          faelights: [
            { x: 318, y: 295, label: 'River (91%)' },
            { x: 365, y: 345, label: 'Tri-Choke (73%)' }
          ],
          markers: [
            { x: 330, y: 325, label: '5:45 Drake Control', detail: 'Sets both Bot Faelight rings 50s pre-spawn and trades first Voidgrubs.' }
          ],
          counter: 'Skip Bot choke check at 5:30; trade 3 Voidgrubs Top on spawn.'
        },
        toppush: {
          headline: '89% 6:00 Voidgrub 4-Man Collapse',
          pathMain: 'M 420,80 L 235,155 L 185,175',
          pathAlt: 'M 110,110 L 175,165',
          faelights: [
            { x: 185, y: 190, label: 'Grub Pit (89%)' },
            { x: 225, y: 145, label: 'Top Jgl (67%)' }
          ],
          markers: [
            { x: 185, y: 175, label: '5:50 Grub Choke', detail: 'Busio bases at 5:15 to reach Top Faelight 10s before spawn.' }
          ],
          counter: 'Match Support base at 5:10 or trade first Dragon + Bot plate.'
        },
        engage: {
          headline: '76% River-Mid Faelight Turn-Fight',
          pathMain: 'M 250,250 L 210,205 L 185,175',
          pathAlt: 'M 330,325 L 285,285',
          faelights: [
            { x: 220, y: 215, label: 'Mid-Top' },
            { x: 295, y: 285, label: 'Mid-Bot' }
          ],
          markers: [
            { x: 215, y: 205, label: '6:05 Turn-Fight', detail: 'Starts objective to bait flankers into Faelight vision, then turns with Vi + Support.' }
          ],
          counter: 'Sweep Faelight edge with Scryer’s Bloom before stepping past mid pixel.'
        }
      }
    };

    const state = { step: 0, prio: 'botpush', selectedMarker: 0 };
    const tabs = [...document.querySelectorAll('[role="tab"]')];

    function setStep(idx, focusTab = false) {
      state.step = Math.max(0, Math.min(tabs.length - 1, idx));
      state.selectedMarker = 0;
      tabs.forEach((tab, i) => {
        const active = i === state.step;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
        tab.toggleAttribute('focusgroupstart', active);
      });
      document.getElementById('mapPanel').setAttribute('aria-labelledby', tabs[state.step].id);
      tabs[state.step].scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (focusTab) tabs[state.step].focus();
      renderAll();
    }

    function renderAll() {
      const data = SCENARIOS[state.step][state.prio];
      const svg = document.getElementById('riftSvg');

      svg.innerHTML = `
        <defs>
          <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
          </marker>
          <marker id="arrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
          </marker>
        </defs>
        <rect x="12" y="12" width="476" height="476" rx="18" fill="#0f1d19" stroke="#223831" stroke-width="2"/>
        <path d="M 95,95 Q 190,195 250,250 Q 315,315 405,405" stroke="#163a4a" stroke-width="36" fill="none" stroke-linecap="round"/>
        <path d="M 55,445 L 55,55 L 445,55" stroke="#24332e" stroke-width="18" fill="none" stroke-linejoin="round"/>
        <path d="M 55,445 L 445,445 L 445,55" stroke="#24332e" stroke-width="18" fill="none" stroke-linejoin="round"/>
        <line x1="60" y1="440" x2="440" y2="60" stroke="#24332e" stroke-width="18"/>
        <circle cx="60" cy="440" r="28" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="2"/>
        <text x="60" y="444" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="700">C9 BLUE</text>
        <circle cx="440" cy="60" r="28" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" stroke-width="2"/>
        <text x="440" y="64" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="700">FLY RED</text>
        <circle cx="178" cy="172" r="14" fill="#1e1b38" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="178" y="152" text-anchor="middle" fill="#c4b5fd" font-size="9">GRUBS</text>
        <circle cx="332" cy="328" r="14" fill="#2c1d16" stroke="#fb923c" stroke-width="1.5"/>
        <text x="332" y="355" text-anchor="middle" fill="#fdba74" font-size="9">DRAGON</text>

        <path d="${data.pathAlt}" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,5" fill="none" marker-end="url(#arrowAmber)"/>
        <path d="${data.pathMain}" stroke="#f43f5e" stroke-width="4" fill="none" marker-end="url(#arrowRed)"/>

        ${data.faelights.map(f => `
          <g>
            <circle cx="${f.x}" cy="${f.y}" r="22" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-dasharray="4,3" stroke-width="1.5"/>
            <circle cx="${f.x}" cy="${f.y}" r="5" fill="#38bdf8"/>
            <text x="${f.x}" y="${f.y - 26}" text-anchor="middle" fill="#7dd3fc" font-size="9.5" font-weight="600">${f.label}</text>
          </g>
        `).join('')}

        ${data.markers.map((m, idx) => `
          <g class="hotspot" data-m="${idx}">
            <circle cx="${m.x}" cy="${m.y}" r="11" fill="${idx === state.selectedMarker ? '#f43f5e' : '#1e293b'}" stroke="#fff" stroke-width="2"/>
            <text x="${m.x}" y="${m.y + 4}" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">${idx + 1}</text>
          </g>
        `).join('')}
      `;

      const activeM = data.markers[state.selectedMarker] || data.markers[0];
      document.getElementById('mapInspector').innerHTML = `
        <h2 style="font-size:1.05rem">${data.headline}</h2>
        ${data.markers.length > 1 ? `
          <div class="marker-tabs" role="group" aria-label="Map checkpoints">
            ${data.markers.map((m, i) => `
              <button type="button" class="marker-btn" aria-pressed="${i === state.selectedMarker}" data-m="${i}">${i + 1}. ${m.label}</button>
            `).join('')}
          </div>
        ` : `<div style="height:12px"></div>`}
        <div class="box">
          <div class="box-label">${activeM.label}</div>
          <p>${activeM.detail}</p>
        </div>
        <div class="box counter">
          <div class="box-label">Counter Call</div>
          <p>${data.counter}</p>
        </div>
      `;
    }

    document.getElementById('tablist').addEventListener('click', e => {
      const b = e.target.closest('[role="tab"]');
      if (b) setStep(Number(b.dataset.step));
    });
    document.getElementById('tablist').addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); setStep((state.step + 1) % tabs.length, true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); setStep((state.step - 1 + tabs.length) % tabs.length, true); }
      else if (e.key === 'Home') { e.preventDefault(); setStep(0, true); }
      else if (e.key === 'End') { e.preventDefault(); setStep(tabs.length - 1, true); }
    });
    document.getElementById('prioStrip').addEventListener('click', e => {
      const p = e.target.closest('.pill');
      if (!p) return;
      state.prio = p.dataset.prio;
      state.selectedMarker = 0;
      document.querySelectorAll('#prioStrip .pill').forEach(el => el.setAttribute('aria-pressed', String(el === p)));
      renderAll();
    });
    document.body.addEventListener('click', e => {
      const g = e.target.closest('[data-m]');
      if (g) { state.selectedMarker = Number(g.dataset.m); renderAll(); }
    });

    if (!CSS.supports('container-type', 'scroll-state')) {
      const bar = document.querySelector('.topnav');
      let lastY = scrollY;
      addEventListener('scroll', () => {
        const y = Math.max(0, Math.min(scrollY, document.documentElement.scrollHeight - innerHeight));
        if (y === lastY) return;
        bar?.classList.toggle('is-hidden', y > lastY && y > bar.offsetHeight);
        lastY = y;
      }, { passive: true });
    }

    renderAll();
  </script>
</body>
</html>
