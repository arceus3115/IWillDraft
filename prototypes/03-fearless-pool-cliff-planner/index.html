<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fearless Pool Cliffs | IWillDraft</title>
  <style>
    :root {
      --bg: #0b0f15;
      --surface: #111822;
      --surface-2: #16202e;
      --border: #1f2d40;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.14);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.15);
      --red: #f43f5e;
      --red-dim: rgba(244, 63, 94, 0.15);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --target-size: 24px;
    }
    @media (pointer: coarse) {
      :root { --target-size: 44px; }
    }
    html {
      container-type: scroll-state;
      scroll-padding-top: 3.5rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-block-size: 100svh;
      line-height: 1.45;
      overflow-wrap: break-word;
    }
    h1, h2, h3 { text-wrap: balance; }
    p, li { text-wrap: pretty; }
    :where(button, nav a) {
      min-block-size: var(--target-size);
      min-inline-size: var(--target-size);
    }
    .topnav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 20px;
      background: rgba(8, 12, 18, 0.94);
      border-block-end: 1px solid var(--border);
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }
    @container scroll-state((scrolled: bottom) and (scrollable: top)) {
      .topnav { transform: translateY(-100%); }
    }
    .topnav:focus-within { transform: none; }
    .topnav.is-hidden:not(:focus-within) { transform: translateY(-100%); }
    .topnav a {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .topnav a:hover { color: var(--text); background: var(--surface); }
    .topnav a[aria-current="page"] { color: var(--accent); background: var(--accent-dim); font-weight: 600; }

    .shell { max-inline-size: 1200px; margin-inline: auto; padding: 20px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-block-end: 16px;
    }
    h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
    button {
      font-family: inherit;
      font-size: 0.84rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 11px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }

    .game-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .g-btn { font-family: var(--mono); font-weight: 700; padding: 5px 10px; }
    .g-btn[aria-pressed="true"] {
      background: var(--red-dim);
      color: #fda4af;
      border-color: var(--red);
    }

    .tablist {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 4px;
      border-block-end: 1px solid var(--border);
      margin-block-end: 18px;
      scrollbar-width: none;
    }
    .tablist::-webkit-scrollbar { display: none; }
    [role="tab"] {
      flex: none;
      position: relative;
      background: transparent;
      border: none;
      border-radius: 6px 6px 0 0;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
    }
    [role="tab"]:hover { color: var(--text); }
    [role="tab"][aria-selected="true"] { color: var(--accent); }
    [role="tab"][aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      border-block-end: 2px solid var(--accent);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
    }
    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .role-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-block-end: 10px;
      cursor: pointer;
    }
    .role-row:last-child { margin-block-end: 0; }
    .role-row.active { border-color: var(--accent); }
    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-block-start: 8px; }
    .chip {
      font-family: var(--mono);
      font-size: 0.74rem;
      padding: 3px 8px;
      border-radius: 5px;
      background: #142030;
      border: 1px solid #283a52;
      color: var(--text);
    }
    .chip.locked {
      text-decoration: line-through;
      opacity: 0.45;
      background: var(--red-dim);
      border-color: rgba(244, 63, 94, 0.35);
      color: #fda4af;
    }
    .chip.pinch {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-dim);
    }
    .chip.pocket {
      border-style: dashed;
      border-color: var(--red);
      color: #fda4af;
      background: transparent;
    }

    .plan-wrap { container-type: inline-size; }
    .plan-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @container (inline-size >= 560px) {
      .plan-grid { grid-template-columns: 1fr 1fr; }
    }
    .plan-box {
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .plan-box.active { border-color: var(--green); background: rgba(16, 185, 129, 0.06); }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .tag.cliff { color: var(--red); background: var(--red-dim); }
    .tag.safe { color: var(--green); background: var(--green-dim); }
    .tag.warn { color: var(--amber); background: var(--amber-dim); }
    .mono { font-family: var(--mono); font-size: 0.8rem; }
    .muted { color: var(--muted); font-size: 0.82rem; }

    .kv {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-block-end: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.84rem;
    }
    .kv.current { color: var(--accent); font-weight: 600; }
    .callout {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.84rem;
      margin-block-start: 12px;
    }
    .callout.alert { border-color: rgba(244, 63, 94, 0.45); color: #fecdd3; }
    @media (prefers-reduced-motion: reduce) {
      .topnav { transition: none; }
    }
  </style>
</head>
<body>
  <nav class="topnav" aria-label="Tools">
    <a href="../index.html">← All</a>
    <a href="../01-universe-riser-matrix/index.html">01 Risers</a>

    <a aria-current="page" href="../03-fearless-pool-cliff-planner/index.html">03 Fearless Cliffs</a>
    <a href="../04-rift-spatial-pathing-map/index.html">04 Early Pathing</a>
    <a href="../05-playbook-huddle-stage-binder/index.html">05 Match Day</a>

  </nav>

  <div class="shell">
    <header class="header">
      <h1>Fearless Pool Cliffs</h1>
      <div class="game-bar" id="gameBtns" role="group" aria-label="Series game">
        <button type="button" class="g-btn" aria-pressed="false" data-g="1">G1</button>
        <button type="button" class="g-btn" aria-pressed="false" data-g="2">G2</button>
        <button type="button" class="g-btn" aria-pressed="false" data-g="3">G3</button>
        <button type="button" class="g-btn" aria-pressed="true" data-g="4">G4</button>
        <button type="button" class="g-btn" aria-pressed="false" data-g="5">G5</button>
        <span class="tag cliff" id="lockPill">30 locked</span>
      </div>
    </header>

    <div class="tablist" role="tablist" focusgroup="tablist nomemory" aria-label="Fearless views" id="tablist">
      <button type="button" role="tab" id="tab-0" aria-selected="true" focusgroupstart tabindex="0" data-step="0">Pool Decay</button>
      <button type="button" role="tab" id="tab-1" aria-selected="false" tabindex="-1" data-step="1">Series EV Tradeoff</button>
      <button type="button" role="tab" id="tab-2" aria-selected="false" tabindex="-1" data-step="2">Pinch Simulator</button>
    </div>

    <div class="workspace">
      <main>
        <section role="tabpanel" id="panel-0" aria-labelledby="tab-0">
          <div class="panel-box" id="decayList"></div>
        </section>

        <section role="tabpanel" id="panel-1" aria-labelledby="tab-1" hidden="until-found">
          <div class="panel-box plan-wrap">
            <div class="plan-grid" id="planGrid"></div>
          </div>
        </section>

        <section role="tabpanel" id="panel-2" aria-labelledby="tab-2" hidden="until-found">
          <div class="panel-box" id="cliffForecaster"></div>
        </section>
      </main>

      <aside class="panel-box" id="cliffInspector" aria-live="polite"></aside>
    </div>
  </div>

  <script src="../shared/engine.js"></script>
  <script>
    const E = window.IWillDraftEngine;
    const PLAYERS = [
      {
        id: 'quad', name: 'Quad', role: 'MID', status: 'Cliff at G4',
        gdByGame: ['+340g', '+260g', '+90g', '-390g', '-540g'],
        wrByGame: ['72%', '67%', '54%', '31%', '25%'],
        comfort: [
          { name: 'Orianna', lockedAt: 1, epa: +2.9 },
          { name: 'Azir', lockedAt: 2, epa: +2.6 },
          { name: 'Galio', lockedAt: 3, epa: +2.1 },
          { name: 'Taliyah', lockedAt: 4, epa: +1.4 },
          { name: 'Hwei', lockedAt: 99, epa: +0.6 },
          { name: 'Syndra', lockedAt: 99, epa: +0.2 }
        ],
        pockets: ['Cassiopeia (n=1, -1.8% EPA)', 'Viktor (n=0)', 'Tristana (84% team AD share)']
      },
      {
        id: 'massu', name: 'Massu', role: 'BOT', status: 'Drops at G4',
        gdByGame: ['+280g', '+210g', '+120g', '-190g', '-310g'],
        wrByGame: ['68%', '64%', '58%', '42%', '38%'],
        comfort: [
          { name: 'Kalista', lockedAt: 1, epa: +2.7 },
          { name: 'Varus', lockedAt: 2, epa: +2.3 },
          { name: 'KaiSa', lockedAt: 3, epa: +1.6 },
          { name: 'Ashe', lockedAt: 4, epa: +1.1 },
          { name: 'Ezreal', lockedAt: 5, epa: -0.2 },
          { name: 'Jhin', lockedAt: 99, epa: -0.9 }
        ],
        pockets: ['Ziggs (n=2, 50% WR)', 'Xayah (n=3, 33% WR)']
      },
      {
        id: 'inspired', name: 'Inspired', role: 'JGL', status: 'Deep Pool',
        gdByGame: ['+410g', '+390g', '+360g', '+330g', '+350g'],
        wrByGame: ['71%', '70%', '68%', '66%', '67%'],
        comfort: [
          { name: 'Vi', lockedAt: 1, epa: +3.4 },
          { name: 'Sejuani', lockedAt: 2, epa: +3.1 },
          { name: 'Maokai', lockedAt: 3, epa: +2.8 },
          { name: 'Skarner', lockedAt: 4, epa: +2.5 },
          { name: 'Ivern', lockedAt: 99, epa: +2.4 },
          { name: 'Viego', lockedAt: 99, epa: +2.2 },
          { name: 'Fiddlesticks', lockedAt: 99, epa: +2.1 }
        ],
        pockets: ['G4–G5 Replacement EPA +2.1% (Δ -0.3% vs G1)']
      },
      {
        id: 'bwipo', name: 'Bwipo', role: 'TOP', status: 'High Variance',
        gdByGame: ['+190g', '+140g', '+110g', '-80g', '+120g'],
        wrByGame: ['62%', '59%', '55%', '48%', '55%'],
        comfort: [
          { name: 'Rumble', lockedAt: 1, epa: +2.2 },
          { name: 'Renekton', lockedAt: 2, epa: +1.5 },
          { name: 'Gnar', lockedAt: 3, epa: +1.2 },
          { name: 'Olaf', lockedAt: 5, epa: +0.9 },
          { name: 'Mordekaiser', lockedAt: 99, epa: +0.4 },
          { name: 'Urgot', lockedAt: 99, epa: +0.7 }
        ],
        pockets: ['Sett (n=4, σ=14.2%)', 'Cho’Gath (n=3, 67% WR)']
      }
    ];

    const PLANS = [
      {
        id: 'take',
        title: 'Burn S-Tier Early (G1–G2)',
        pSuccess: 0.62, gainWP: +7.5, lossWP: -9.8,
        midLockShift: 1,
        g4Impact: 'G1–G2 ΔWP +4.6% · Quad enters G4 with 3 comfort picks open (Rep EPA +1.4%).',
        tone: 'warn'
      },
      {
        id: 'starve',
        title: 'Mid-Pool Depletion (G1–G3)',
        pSuccess: 0.56, gainWP: +12.4, lossWP: -6.2,
        midLockShift: 0,
        g4Impact: 'G4 Replacement EPA drops to -3.5% with 2 pinch bans (0 comfort picks remaining).',
        tone: 'safe'
      }
    ];

    const state = {
      game: 4,
      step: 0,
      selectedPlayer: 'quad',
      plan: 'starve',
      pinchBans: new Set(['Hwei', 'Syndra'])
    };

    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];

    function setStep(idx, focusTab = false) {
      state.step = Math.max(0, Math.min(tabs.length - 1, idx));
      tabs.forEach((tab, i) => {
        const active = i === state.step;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
        tab.toggleAttribute('focusgroupstart', active);
      });
      panels.forEach((panel, i) => {
        if (i === state.step) panel.removeAttribute('hidden');
        else panel.hidden = 'until-found';
      });
      tabs[state.step].scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (focusTab) tabs[state.step].focus();
      renderAll();
    }

    panels.forEach((panel, i) => panel.addEventListener('beforematch', () => setStep(i)));

    function renderAll() {
      const lockedTotal = (state.game - 1) * 10;
      document.getElementById('lockPill').textContent = `${lockedTotal} locked`;
      document.querySelectorAll('.g-btn').forEach(b => {
        b.setAttribute('aria-pressed', String(Number(b.dataset.g) === state.game));
      });

      const activePlan = PLANS.find(x => x.id === state.plan) || PLANS[1];
      const lockShiftFor = (playerId) => playerId === 'quad' ? activePlan.midLockShift : 0;

      document.getElementById('decayList').innerHTML = PLAYERS.map(p => {
        const shift = lockShiftFor(p.id);
        const lockedNames = new Set(p.comfort.filter(c => (c.lockedAt + shift) < state.game).map(c => c.name));
        state.pinchBans.forEach(b => lockedNames.add(b));
        const vorp = E.computeFearlessVORP(p.comfort.map(c => ({ champ: c.name, epa: c.epa })), lockedNames);
        const gd = p.gdByGame[state.game - 1];
        const wr = p.wrByGame[state.game - 1];
        const isCliff = vorp.replacementEpa < 0;
        return `
          <div class="role-row ${p.id === state.selectedPlayer ? 'active' : ''}" data-player="${p.id}">
            <div class="row-top">
              <strong>${p.name} <span class="mono muted">${p.role}</span></strong>
              <div style="display:flex;gap:8px;align-items:center">
                <span class="tag ${isCliff ? 'cliff' : 'safe'}">Rep EPA ${vorp.replacementEpa >= 0 ? '+' : ''}${vorp.replacementEpa}% · ${wr}</span>
                <span class="muted mono" style="font-size:0.78rem">${gd}</span>
              </div>
            </div>
            <div class="chips">
              ${p.comfort.map(c => {
                const effLock = c.lockedAt + shift;
                const isLocked = effLock < state.game;
                const isPinch = !isLocked && state.pinchBans.has(c.name);
                return `<span class="chip ${isLocked ? 'locked' : ''} ${isPinch ? 'pinch' : ''}">${c.name}${isLocked ? ' G' + effLock : isPinch ? ' · Ban' : ''}</span>`;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('planGrid').innerHTML = PLANS.map(pl => {
        const pt = E.evaluateProspectDecision(pl.pSuccess, pl.gainWP, pl.lossWP);
        return `
        <button type="button" class="plan-box ${state.plan === pl.id ? 'active' : ''}" data-plan="${pl.id}">
          <h2 style="font-size:1rem;margin-block-end:6px">${pl.title}</h2>
          <p class="mono muted" style="margin-block-end:8px;font-size:0.8rem">Risk-Neutral EV: ${pt.ev >= 0 ? '+' : ''}${pt.ev}% · Prospect U_PT: ${pt.uPT >= 0 ? '+' : ''}${pt.uPT}</p>
          <p style="font-size:0.84rem;margin-block-end:10px">${pl.g4Impact}</p>
          <span class="tag ${pl.tone}">p=${Math.round(pl.pSuccess * 100)}% · Bias Gap ${pt.biasGap >= 0 ? '+' : ''}${pt.biasGap}</span>
        </button>
      `;
      }).join('');

      const quad = PLAYERS[0];
      const qShift = lockShiftFor('quad');
      const openComfort = quad.comfort.filter(c => (c.lockedAt + qShift) >= state.game && !state.pinchBans.has(c.name));
      const qLocked = new Set(quad.comfort.filter(c => (c.lockedAt + qShift) < state.game).map(c => c.name));
      state.pinchBans.forEach(b => qLocked.add(b));
      const qVorp = E.computeFearlessVORP(quad.comfort.map(c => ({ champ: c.name, epa: c.epa })), qLocked);

      document.getElementById('cliffForecaster').innerHTML = `
        <div class="row-top" style="margin-block-end:10px">
          <strong>Quad (Mid) · Game ${state.game} (${activePlan.id === 'take' ? 'Burn Early' : 'Mid Depletion'})</strong>
          <span class="tag ${openComfort.length === 0 ? 'cliff' : 'warn'}">
            ${openComfort.length === 0 ? '0 comfort · Rep EPA ' + qVorp.replacementEpa + '%' : openComfort.length + ' open · Rep EPA ' + (qVorp.replacementEpa >= 0 ? '+' : '') + qVorp.replacementEpa + '%'}
          </span>
        </div>
        <div class="chips" style="margin-block-end:14px">
          ${quad.comfort.map(c => {
            const effLock = c.lockedAt + qShift;
            const isLocked = effLock < state.game;
            const isPinch = state.pinchBans.has(c.name);
            return `<button type="button" class="chip ${isLocked ? 'locked' : ''} ${isPinch ? 'pinch' : ''}" ${isLocked ? 'disabled' : `data-toggleban="${c.name}"`}>
              ${c.name}${isLocked ? ' (G' + effLock + ')' : isPinch ? ' ✕' : ''}
            </button>`;
          }).join('')}
        </div>
        <div class="muted" style="margin-block-end:6px">Empirical fallback pool</div>
        <div class="chips">
          ${quad.pockets.map(pk => `<span class="chip pocket">${pk}</span>`).join('')}
        </div>
      `;

      const sel = PLAYERS.find(x => x.id === state.selectedPlayer) || PLAYERS[0];
      const sShift = lockShiftFor(sel.id);
      const sLocked = new Set(sel.comfort.filter(c => (c.lockedAt + sShift) < state.game).map(c => c.name));
      state.pinchBans.forEach(b => sLocked.add(b));
      const sVorp = E.computeFearlessVORP(sel.comfort.map(c => ({ champ: c.name, epa: c.epa })), sLocked);
      document.getElementById('cliffInspector').innerHTML = `
        <h2 style="font-size:1.05rem;margin-block-end:8px">${sel.name} <span class="mono muted">${sel.role}</span></h2>
        <div class="kv"><span>G${state.game} Replacement EPA</span><span class="mono">${sVorp.replacementEpa >= 0 ? '+' : ''}${sVorp.replacementEpa}%</span></div>
        <div class="kv"><span>Top-to-Rep Cliff Δ</span><span class="mono">${sVorp.cliffDelta >= 0 ? '+' : ''}${sVorp.cliffDelta}%</span></div>
        ${sel.gdByGame.map((gd, i) => `
          <div class="kv ${i + 1 === state.game ? 'current' : ''}">
            <span>Game ${i + 1}</span>
            <span class="mono">${gd} · ${sel.wrByGame[i]}</span>
          </div>
        `).join('')}
        <div class="callout mono ${sVorp.replacementEpa < 0 ? 'alert' : ''}" style="font-size:0.78rem">
          ${sVorp.available.length === 0
            ? '0 proven comfort picks open · Replacement EPA -3.5% · Historical G4/G5 WR 28%.'
            : 'Remaining legal comfort: ' + sVorp.available.length + ' · Avg EPA ' + (sVorp.avgEpa >= 0 ? '+' : '') + sVorp.avgEpa + '%.'}
        </div>
      `;
    }

    document.getElementById('gameBtns').addEventListener('click', e => {
      const b = e.target.closest('.g-btn');
      if (b) { state.game = Number(b.dataset.g); renderAll(); }
    });
    document.getElementById('tablist').addEventListener('click', e => {
      const b = e.target.closest('[role="tab"]');
      if (b) setStep(Number(b.dataset.step));
    });
    document.getElementById('tablist').addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); setStep((state.step + 1) % tabs.length, true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); setStep((state.step - 1 + tabs.length) % tabs.length, true); }
      else if (e.key === 'Home') { e.preventDefault(); setStep(0, true); }
      else if (e.key === 'End') { e.preventDefault(); setStep(tabs.length - 1, true); }
    });
    document.body.addEventListener('click', e => {
      const p = e.target.closest('[data-player]');
      if (p) { state.selectedPlayer = p.dataset.player; renderAll(); return; }
      const pl = e.target.closest('[data-plan]');
      if (pl) { state.plan = pl.dataset.plan; renderAll(); return; }
      const tb = e.target.closest('[data-toggleban]');
      if (tb && tb.dataset.toggleban) {
        const name = tb.dataset.toggleban;
        if (state.pinchBans.has(name)) state.pinchBans.delete(name);
        else state.pinchBans.add(name);
        renderAll();
      }
    });

    if (!CSS.supports('container-type', 'scroll-state')) {
      const bar = document.querySelector('.topnav');
      let lastY = scrollY;
      addEventListener('scroll', () => {
        const y = Math.max(0, Math.min(scrollY, document.documentElement.scrollHeight - innerHeight));
        if (y === lastY) return;
        bar?.classList.toggle('is-hidden', y > lastY && y > bar.offsetHeight);
        lastY = y;
      }, { passive: true });
    }

    renderAll();
  </script>
</body>
</html>
