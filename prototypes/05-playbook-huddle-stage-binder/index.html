<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match-Day Playbook | IWillDraft</title>
  <style>
    :root {
      --bg: #0b0f15;
      --surface: #111822;
      --surface-2: #16202e;
      --border: #1f2d40;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.14);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.15);
      --red: #f43f5e;
      --red-dim: rgba(244, 63, 94, 0.15);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --target-size: 24px;
    }
    @media (pointer: coarse) {
      :root { --target-size: 44px; }
    }
    html {
      container-type: scroll-state;
      scroll-padding-top: 3.5rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-block-size: 100svh;
      line-height: 1.45;
      overflow-wrap: break-word;
    }
    h1, h2, h3 { text-wrap: balance; }
    p, li { text-wrap: pretty; }
    :where(button, nav a) {
      min-block-size: var(--target-size);
      min-inline-size: var(--target-size);
    }
    .topnav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 20px;
      background: rgba(8, 12, 18, 0.94);
      border-block-end: 1px solid var(--border);
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }
    @container scroll-state((scrolled: bottom) and (scrollable: top)) {
      .topnav { transform: translateY(-100%); }
    }
    .topnav:focus-within { transform: none; }
    .topnav.is-hidden:not(:focus-within) { transform: translateY(-100%); }
    .topnav a {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .topnav a:hover { color: var(--text); background: var(--surface); }
    .topnav a[aria-current="page"] { color: var(--accent); background: var(--accent-dim); font-weight: 600; }

    .shell { max-inline-size: 1200px; margin-inline: auto; padding: 20px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-block-end: 16px;
    }
    h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
    button {
      font-family: inherit;
      font-size: 0.84rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 12px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.45);
      font-weight: 600;
    }

    .tablist {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 4px;
      border-block-end: 1px solid var(--border);
      margin-block-end: 18px;
      scrollbar-width: none;
    }
    .tablist::-webkit-scrollbar { display: none; }
    [role="tab"] {
      flex: none;
      position: relative;
      background: transparent;
      border: none;
      border-radius: 6px 6px 0 0;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
    }
    [role="tab"]:hover { color: var(--text); }
    [role="tab"][aria-selected="true"] { color: var(--accent); }
    [role="tab"][aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      border-block-end: 2px solid var(--accent);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
    }
    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .branch-box {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px;
      margin-block-end: 10px;
      color: var(--text);
    }
    .branch-box:last-child { margin-block-end: 0; }
    .branch-box.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.08); }
    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-block-end: 6px;
    }
    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .tag.ok { color: var(--green); background: var(--green-dim); }
    .tag.warn { color: var(--amber); background: var(--amber-dim); }
    .tag.alert { color: var(--red); background: var(--red-dim); }
    .mono { font-family: var(--mono); font-size: 0.78rem; }
    .muted { color: var(--muted); font-size: 0.82rem; }

    .diff-wrap { container-type: inline-size; }
    .diff-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @container (inline-size >= 560px) {
      .diff-grid { grid-template-columns: 1fr 1fr; }
    }
    .diff-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .diff-title {
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-block-end: 6px;
    }

    .kv {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 9px 0;
      border-block-end: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.84rem;
    }
    .kv:last-child { border-block-end: none; }
    .kv-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }

    .paper {
      background: #ffffff;
      color: #0f172a;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #cbd5e1;
    }
    .paper h2 {
      font-size: 1rem;
      color: #0f172a;
      border-block-end: 2px solid #0f172a;
      padding-block-end: 6px;
      margin-block-end: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .paper-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
      font-size: 0.8rem;
    }
    .paper-sec {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px;
    }
    .paper-sec h3 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #334155;
      margin-block-end: 6px;
    }

    @media (prefers-reduced-motion: reduce) {
      .topnav { transition: none; }
    }
    @media print {
      body { background: #fff; color: #000; }
      .topnav, .header, .tablist, #sideGuardrailPanel { display: none !important; }
      .shell { padding: 0; }
      .workspace { display: block; }
      .panel-box { border: none; padding: 0; background: #fff; }
      .paper { border: 1px solid #000; }
    }
  </style>
</head>
<body>
  <nav class="topnav" aria-label="Tools">
    <a href="../index.html">← All</a>
    <a href="../01-universe-riser-matrix/index.html">01 Risers</a>
    <a href="../02-conditional-phase1-trees/index.html">02 Draft Trees</a>
    <a href="../03-fearless-pool-cliff-planner/index.html">03 Fearless Cliffs</a>
    <a href="../04-rift-spatial-pathing-map/index.html">04 Early Pathing</a>
    <a aria-current="page" href="../05-playbook-huddle-stage-binder/index.html">05 Match Day</a>
    <a href="../06-game-phase-epa-betrayal/index.html">06 Phase EPA</a>
    <a href="../07-patch-equilibrium-shift/index.html">07 Patch Shift</a>
  </nav>

  <div class="shell">
    <header class="header">
      <h1 id="pageHeading">Match-Day Playbook · Game 3 (1–1)</h1>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="seriesGameSelect" aria-label="Fearless series game">
          <option value="1">Game 1 (0 locked)</option>
          <option value="2">Game 2 (10 locked)</option>
          <option value="3" selected>Game 3 (20 locked)</option>
          <option value="4">Game 4 (30 locked)</option>
          <option value="5">Game 5 (40 locked)</option>
        </select>
        <button type="button" class="primary" id="printSheetBtn">Print Stage Sheet</button>
      </div>
    </header>

    <div class="tablist" role="tablist" focusgroup="tablist nomemory" aria-label="Match-day views" id="tablist">
      <button type="button" role="tab" id="tab-0" aria-selected="true" focusgroupstart tabindex="0" data-step="0">Game Plan</button>
      <button type="button" role="tab" id="tab-1" aria-selected="false" tabindex="-1" data-step="1">5-Min Huddle</button>
      <button type="button" role="tab" id="tab-2" aria-selected="false" tabindex="-1" data-step="2">Stage Sheet</button>
    </div>

    <div class="workspace">
      <main>
        <section role="tabpanel" id="panel-0" aria-labelledby="tab-0">
          <div class="panel-box" id="playbookBranches"></div>
        </section>

        <section role="tabpanel" id="panel-1" aria-labelledby="tab-1" hidden="until-found">
          <div class="panel-box diff-wrap">
            <div class="diff-grid" id="huddleGrid"></div>
          </div>
        </section>

        <section role="tabpanel" id="panel-2" aria-labelledby="tab-2" hidden="until-found">
          <div class="panel-box">
            <div class="paper" id="stagePaper"></div>
          </div>
        </section>
      </main>

      <aside class="panel-box" id="sideGuardrailPanel" aria-live="polite"></aside>
    </div>
  </div>

  <script src="../shared/engine.js"></script>
  <script>
    const E = window.IWillDraftEngine;
    const BRANCHES = [
      {
        id: 'b-galio-deny',
        short: 'Branch A · Blue B1 Skarner',
        keyChamps: ['Skarner', 'Galio', 'Hwei', 'Syndra'],
        bans1: 'Vi · Aurora · Galio',
        ifThen: 'FLY R1/R2 = Sejuani + Jinx (38%, n=8) → C9 B2/B3 Azir + Rell (+3.1% ΔWP).',
        pinch2: 'Hwei · Syndra (Mid Rep EPA -3.5%)',
        guardrails: { apAd: '58% AD / 42% AP', ev: '+3.1% ΔWP (n=8)', sr: '63% SR', status: 'ok' }
      },
      {
        id: 'b-yone-flex',
        short: 'Branch B · Blue B1 Yone',
        keyChamps: ['Yone', 'Poppy', 'Taliyah'],
        bans1: 'Vi · Poppy · Taliyah',
        ifThen: 'FLY R1/R2 = Maokai + Tristana (33%, n=9) → C9 B2/B3 Zyra + Ashe (+1.8% ΔWP).',
        pinch2: 'Renekton · Braum (Top/Sup Rep EPA -1.2%)',
        guardrails: { apAd: '52% AD / 48% AP', ev: '+1.8% ΔWP (n=9)', sr: '56% SR', status: 'warn' }
      },
      {
        id: 'b-ksante-sleeper',
        short: 'Branch C · Red R1/R2 vs Aurora',
        keyChamps: ['Aurora', 'Jarvan IV'],
        bans1: 'Vi · Kalista · Poppy',
        ifThen: 'FLY B1 = Aurora (89% Mid, n=9) → C9 R1/R2 K’Sante + Jarvan IV (+2.9% ΔWP).',
        pinch2: 'Olaf · Mordekaiser (Top Rep EPA -0.8%)',
        guardrails: { apAd: 'Needs AP B4/R4', ev: '+2.9% ΔWP (n=9)', sr: '67% SR', status: 'ok' }
      }
    ];

    const state = {
      step: 0,
      game: 3,
      activeBranch: 'b-galio-deny',
      includeSpikeCallout: true
    };

    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];

    function setStep(idx, focusTab = false) {
      state.step = Math.max(0, Math.min(tabs.length - 1, idx));
      tabs.forEach((tab, i) => {
        const active = i === state.step;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
        tab.toggleAttribute('focusgroupstart', active);
      });
      panels.forEach((panel, i) => {
        if (i === state.step) panel.removeAttribute('hidden');
        else panel.hidden = 'until-found';
      });
      tabs[state.step].scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (focusTab) tabs[state.step].focus();
      renderAll();
    }

    panels.forEach((panel, i) => panel.addEventListener('beforematch', () => setStep(i)));

    function renderAll() {
      const selected = BRANCHES.find(b => b.id === state.activeBranch) || BRANCHES[0];
      const lockedSet = E.getLockedChampions(state.game);
      const lockedArr = Array.from(lockedSet);
      const lockedCount = lockedArr.length;

      document.getElementById('pageHeading').textContent = `Match-Day Playbook · Game ${state.game} (${lockedCount} Locked)`;

      document.getElementById('playbookBranches').innerHTML = BRANCHES.map(b => {
        const conflicts = b.keyChamps.filter(c => lockedSet.has(c));
        return `
        <button type="button" class="branch-box ${b.id === state.activeBranch ? 'active' : ''}" data-branch="${b.id}">
          <div class="row-top">
            <strong>${b.short}</strong>
            <span class="tag ${conflicts.length ? 'warn' : 'ok'}">
              ${conflicts.length ? conflicts.length + ' Fearless Lock' : (b.id === state.activeBranch ? 'On Stage Sheet' : 'Legal G' + state.game)}
            </span>
          </div>
          <div class="mono" style="color:#7dd3fc;margin-block-end:4px">P1 Bans: ${b.bans1}</div>
          <p style="font-size:0.84rem;margin-block-end:4px">${b.ifThen}</p>
          <div class="mono muted">P2 Pinch: ${b.pinch2}${conflicts.length ? ' · Locked: ' + conflicts.join(', ') : ''}</div>
        </button>
      `;
      }).join('');

      const recent10 = lockedArr.slice(-10);
      document.getElementById('huddleGrid').innerHTML = `
        <div class="diff-card">
          <div class="diff-title">Fearless Locked Pool (${lockedCount} Total)</div>
          <p class="mono" style="color:#fda4af;margin-block-end:8px;font-size:0.78rem">
            ${lockedCount === 0 ? 'None (Game 1 open pool)' : 'Latest Game: ' + recent10.join(', ')}
          </p>
          <p class="muted mono" style="font-size:0.78rem">Cumulative locked: ${lockedCount}/169 · Quad Mid Rep EPA: ${state.game >= 4 ? '-3.5%' : '+1.4%'}.</p>
        </div>
        <div class="diff-card">
          <div class="diff-title">Phase P4 Betrayal Flag</div>
          <p style="font-size:0.84rem;color:#fde68a;margin-block-end:8px">
            Prev Game P1–P3 EPA +3.2% vs P4 EPA -2.8% (BI +7.5) · 13:42 fight entered with 1,250 unspent gold.
          </p>
          <button type="button" id="toggleSpikeNoteBtn">
            ${state.includeSpikeCallout ? '✓ On Stage Sheet' : '+ Add to Stage Sheet'}
          </button>
        </div>
        <div class="diff-card">
          <div class="diff-title">Observed Side Selection</div>
          <p class="muted mono" style="font-size:0.8rem">Post-loss FLY Red Side rate: 81% (13/16) · R5 Top counter share 69%.</p>
        </div>
        <div class="diff-card">
          <div class="diff-title">Early Pathing Delta (G${state.game})</div>
          <p class="muted mono" style="font-size:0.8rem">With Vi/Sejuani ${lockedSet.has('Vi') ? 'locked' : 'open'}: FLY 1:12 Raptor invade ${lockedSet.has('Vi') ? '18% (n=11)' : '73% (n=22)'}.</p>
        </div>
      `;

      document.getElementById('stagePaper').innerHTML = `
        <h2>
          <span>C9 STAGE SHEET · GAME ${state.game} (${lockedCount} LOCKED)</span>
          <span class="mono">PATCH 26.23 · VS FLY</span>
        </h2>
        <div class="paper-grid">
          <div class="paper-sec">
            <h3>Fearless Locked (${lockedCount})</h3>
            <div class="mono" style="font-size:0.76rem;line-height:1.5">
              ${lockedCount === 0 ? 'Open pool (0 champions locked)' : lockedArr.join(' · ')}
            </div>
          </div>
          <div class="paper-sec">
            <h3>Selected Draft Line</h3>
            <strong>${selected.short}</strong>
            <div style="margin-block-start:4px"><strong>P1 Bans:</strong> ${selected.bans1}</div>
            <div style="margin-block-start:4px">${selected.ifThen}</div>
            <div style="margin-block-start:4px"><strong>P2 Pinch:</strong> ${selected.pinch2}</div>
          </div>
          <div class="paper-sec">
            <h3>Empirical Flex &amp; Cliff Data</h3>
            • <strong>Aurora:</strong> 89% Quad Mid (n=9, H=0.50)<br/>
            • <strong>Maokai:</strong> 100% Inspired JGL (n=8, H=0.00)<br/>
            • <strong>Quad G${state.game} Rep EPA:</strong> ${state.game >= 4 ? '-3.5% (0 comfort w/ 2 bans)' : '+1.4%'}
          </div>
          <div class="paper-sec">
            <h3>Empirical Phase Flags</h3>
            • <strong>P1 (1:08–1:16):</strong> FLY Raptor ward ${lockedSet.has('Vi') ? '18%' : '73%'}<br/>
            • <strong>P2–P3 (5:45):</strong> FLY Dual Bot Faelight 88% (n=17)<br/>
            ${state.includeSpikeCallout ? '• <strong>P4 Leak Flag:</strong> 13:42 fight -2.8% EPA w/ 1,250 unspent gold' : ''}
          </div>
        </div>
      `;

      document.getElementById('sideGuardrailPanel').innerHTML = `
        <h2 style="font-size:1.05rem;margin-block-end:6px">${selected.short}</h2>
        <div class="kv"><span class="kv-label">Fearless Pool</span><span class="mono">G${state.game} (${lockedCount} locked)</span></div>
        <div class="kv"><span class="kv-label">Damage Split</span><span class="mono">${selected.guardrails.apAd}</span></div>
        <div class="kv"><span class="kv-label">Branch EV</span><span class="mono">${selected.guardrails.ev}</span></div>
        <div class="kv"><span class="kv-label">Success Rate</span><span class="mono">${selected.guardrails.sr}</span></div>
      `;

      const spikeBtn = document.getElementById('toggleSpikeNoteBtn');
      if (spikeBtn) spikeBtn.onclick = () => { state.includeSpikeCallout = !state.includeSpikeCallout; renderAll(); };
    }

    document.getElementById('tablist').addEventListener('click', e => {
      const b = e.target.closest('[role="tab"]');
      if (b) setStep(Number(b.dataset.step));
    });
    document.getElementById('tablist').addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); setStep((state.step + 1) % tabs.length, true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); setStep((state.step - 1 + tabs.length) % tabs.length, true); }
      else if (e.key === 'Home') { e.preventDefault(); setStep(0, true); }
      else if (e.key === 'End') { e.preventDefault(); setStep(tabs.length - 1, true); }
    });
    document.getElementById('printSheetBtn').addEventListener('click', () => { setStep(2); window.print(); });
    document.getElementById('seriesGameSelect').addEventListener('change', e => {
      state.game = Number(e.target.value);
      renderAll();
    });
    document.body.addEventListener('click', e => {
      const br = e.target.closest('[data-branch]');
      if (br) { state.activeBranch = br.dataset.branch; renderAll(); }
    });

    if (!CSS.supports('container-type', 'scroll-state')) {
      const bar = document.querySelector('.topnav');
      let lastY = scrollY;
      addEventListener('scroll', () => {
        const y = Math.max(0, Math.min(scrollY, document.documentElement.scrollHeight - innerHeight));
        if (y === lastY) return;
        bar?.classList.toggle('is-hidden', y > lastY && y > bar.offsetHeight);
        lastY = y;
      }, { passive: true });
    }

    renderAll();
  </script>
</body>
</html>
